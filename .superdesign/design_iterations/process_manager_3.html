<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NetTop — Process Manager</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  @keyframes pulse-dot {
    0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(16,185,129,0.6); }
    50% { opacity: 0.7; box-shadow: 0 0 0 6px rgba(16,185,129,0); }
  }
  .live-dot { animation: pulse-dot 2s ease-in-out infinite; }
  body { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
  .font-mono { font-family: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", monospace; }
  ::-webkit-scrollbar { height: 8px; width: 8px; }
  ::-webkit-scrollbar-track { background: #0a0a0a; }
  ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 8px; }
  tr.row-hidden { display: none; }
  .card-hidden { display: none; }
</style>
</head>
<body class="bg-black text-white min-h-screen">

<div class="max-w-[1440px] mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">

  <!-- Top bar -->
  <header class="bg-zinc-950 border border-zinc-800 rounded-lg p-4 sm:p-6 space-y-4">
    <div class="flex flex-wrap items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-lg bg-zinc-900 border border-zinc-800 flex items-center justify-center">
          <svg viewBox="0 0 24 24" class="w-5 h-5 text-emerald-500" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="16" rx="2"></rect>
            <path d="M7 8l3 3-3 3"></path>
            <line x1="12" y1="14" x2="17" y2="14"></line>
          </svg>
        </div>
        <div>
          <h1 class="text-white font-semibold text-lg leading-none">NetTop</h1>
          <p class="text-white/50 text-xs font-mono mt-1">process &amp; connection monitor</p>
        </div>
        <span class="flex items-center gap-2 ml-2 pl-3 border-l border-zinc-800">
          <span class="w-2 h-2 rounded-full bg-emerald-500 live-dot"></span>
          <span class="text-emerald-400 text-xs font-mono">live</span>
        </span>
      </div>

      <div class="flex items-center gap-2 bg-zinc-900 border border-zinc-800 rounded-lg px-4 py-2">
        <span class="text-white/50 text-xs font-mono uppercase tracking-wide">connections</span>
        <span id="connCount" class="text-white font-mono font-semibold text-sm">10</span>
      </div>
    </div>

    <div class="flex flex-col sm:flex-row sm:items-center gap-3">
      <div class="relative flex-1 max-w-xs">
        <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-white/40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="7"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input
          id="portFilter"
          type="text"
          inputmode="numeric"
          placeholder="Filter by port…"
          class="w-full bg-zinc-900 border border-zinc-800 rounded-lg pl-9 pr-4 py-2 text-sm font-mono text-white placeholder:text-white/30 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition"
        />
      </div>

      <div class="flex items-center gap-2">
        <button type="button" data-proto="ALL" class="proto-pill px-3 py-2 rounded-lg text-xs font-mono border border-emerald-600 bg-emerald-500/10 text-emerald-400">ALL</button>
        <button type="button" data-proto="TCP" class="proto-pill px-3 py-2 rounded-lg text-xs font-mono border border-zinc-800 bg-zinc-900 text-white/70 hover:bg-zinc-800 transition">TCP</button>
        <button type="button" data-proto="UDP" class="proto-pill px-3 py-2 rounded-lg text-xs font-mono border border-zinc-800 bg-zinc-900 text-white/70 hover:bg-zinc-800 transition">UDP</button>
      </div>
    </div>
  </header>

  <!-- Summary strip -->
  <section class="grid grid-cols-2 sm:grid-cols-4 gap-3 sm:gap-4">
    <div class="bg-zinc-950 border border-zinc-800 rounded-lg p-4">
      <p class="text-white/50 text-xs font-mono uppercase tracking-wide">Total Processes</p>
      <p class="text-white text-2xl font-mono font-semibold mt-2">10</p>
    </div>
    <div class="bg-zinc-950 border border-zinc-800 rounded-lg p-4">
      <p class="text-white/50 text-xs font-mono uppercase tracking-wide">Active Listeners</p>
      <p class="text-emerald-400 text-2xl font-mono font-semibold mt-2">6</p>
    </div>
    <div class="bg-zinc-950 border border-zinc-800 rounded-lg p-4">
      <p class="text-white/50 text-xs font-mono uppercase tracking-wide">Established</p>
      <p class="text-blue-400 text-2xl font-mono font-semibold mt-2">2</p>
    </div>
    <div class="bg-zinc-950 border border-zinc-800 rounded-lg p-4">
      <p class="text-white/50 text-xs font-mono uppercase tracking-wide">Bandwidth</p>
      <p class="text-white text-2xl font-mono font-semibold mt-2">184.2 <span class="text-sm text-white/40">MB/s</span></p>
    </div>
  </section>

  <!-- Table (desktop/tablet) -->
  <section class="bg-zinc-950 border border-zinc-800 rounded-lg overflow-hidden">
    <div class="hidden md:block overflow-x-auto">
      <table class="w-full text-sm">
        <thead>
          <tr class="border-b border-zinc-800 text-white/50 text-xs font-mono uppercase tracking-wide">
            <th class="text-left font-medium px-6 py-3">Process</th>
            <th class="text-left font-medium px-4 py-3">PID</th>
            <th class="text-left font-medium px-4 py-3">Port</th>
            <th class="text-left font-medium px-4 py-3">Protocol</th>
            <th class="text-left font-medium px-4 py-3">Address</th>
            <th class="text-left font-medium px-4 py-3">State</th>
            <th class="text-right font-medium px-6 py-3">Action</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <!-- rows injected below via markup, duplicated in cards for mobile -->
        </tbody>
      </table>
    </div>

    <!-- Cards (mobile) -->
    <div id="cardList" class="md:hidden divide-y divide-zinc-800"></div>

    <div id="emptyState" class="hidden py-16 text-center">
      <p class="text-white/40 text-sm font-mono">No connections match this port.</p>
    </div>
  </section>

  <footer class="text-center text-white/30 text-xs font-mono py-4">
    NetTop v1.0 · snapshot updated 2s ago
  </footer>
</div>

<script>
  const data = [
    { proc: "sshd",         pid: 1042, port: 22,    proto: "TCP", addr: "0.0.0.0",        state: "LISTEN" },
    { proc: "nginx",        pid: 2381, port: 80,    proto: "TCP", addr: "0.0.0.0",        state: "LISTEN" },
    { proc: "nginx",        pid: 2381, port: 443,   proto: "TCP", addr: "0.0.0.0",        state: "LISTEN" },
    { proc: "node",         pid: 5510, port: 3000,  proto: "TCP", addr: "127.0.0.1",      state: "ESTABLISHED" },
    { proc: "postgres",     pid: 3390, port: 5432,  proto: "TCP", addr: "127.0.0.1",      state: "LISTEN" },
    { proc: "redis-server", pid: 4021, port: 6379,  proto: "TCP", addr: "127.0.0.1",      state: "TIME_WAIT" },
    { proc: "dockerd",      pid: 998,  port: 8080,  proto: "TCP", addr: "172.17.0.1",     state: "LISTEN" },
    { proc: "python3",      pid: 6644, port: 5000,  proto: "UDP", addr: "0.0.0.0",        state: "CLOSE_WAIT" },
    { proc: "mongod",       pid: 7215, port: 27017, proto: "TCP", addr: "127.0.0.1",      state: "LISTEN" },
    { proc: "caddy",        pid: 8890, port: 9000,  proto: "UDP", addr: "0.0.0.0",        state: "ESTABLISHED" },
  ];

  const stateStyles = {
    LISTEN:      "bg-emerald-500/10 text-emerald-400 border-emerald-500/30",
    ESTABLISHED: "bg-blue-500/10 text-blue-400 border-blue-500/30",
    TIME_WAIT:   "bg-amber-500/10 text-amber-400 border-amber-500/30",
    CLOSE_WAIT:  "bg-red-500/10 text-red-400 border-red-500/30",
  };

  const tableBody = document.getElementById("tableBody");
  const cardList = document.getElementById("cardList");

  function killRow(pid, btn) {
    const row = document.querySelector(`tr[data-pid="${pid}"]`);
    const card = document.querySelector(`div[data-pid-card="${pid}"]`);
    if (row) row.remove();
    if (card) card.remove();
    updateCount();
  }

  function updateCount() {
    const visibleRows = document.querySelectorAll('#tableBody tr:not(.row-hidden)').length;
    document.getElementById("connCount").textContent = visibleRows;
  }

  data.forEach((d) => {
    const pill = `<span class="inline-flex items-center px-2 py-1 rounded-md text-xs font-mono border ${stateStyles[d.state]}">${d.state}</span>`;

    const tr = document.createElement("tr");
    tr.setAttribute("data-pid", d.pid);
    tr.setAttribute("data-port", d.port);
    tr.setAttribute("data-proto", d.proto);
    tr.className = "border-b border-zinc-800 last:border-0 hover:bg-zinc-900/60 transition";
    tr.innerHTML = `
      <td class="px-6 py-3 text-white font-sans">${d.proc}</td>
      <td class="px-4 py-3 text-white/70 font-mono">${d.pid}</td>
      <td class="px-4 py-3 text-white font-mono">${d.port}</td>
      <td class="px-4 py-3 text-white/70 font-mono">${d.proto}</td>
      <td class="px-4 py-3 text-white/70 font-mono">${d.addr}</td>
      <td class="px-4 py-3">${pill}</td>
      <td class="px-6 py-3 text-right">
        <button type="button" class="kill-btn px-3 py-1.5 rounded-lg bg-red-600 hover:bg-red-500 text-white text-xs font-medium transition focus:outline-none focus:ring-2 focus:ring-red-500">Kill</button>
      </td>
    `;
    tr.querySelector(".kill-btn").addEventListener("click", () => killRow(d.pid));
    tableBody.appendChild(tr);

    const card = document.createElement("div");
    card.setAttribute("data-pid-card", d.pid);
    card.setAttribute("data-port", d.port);
    card.setAttribute("data-proto", d.proto);
    card.className = "p-4 space-y-3";
    card.innerHTML = `
      <div class="flex items-center justify-between">
        <span class="text-white font-sans font-medium">${d.proc}</span>
        ${pill}
      </div>
      <div class="grid grid-cols-3 gap-2 text-xs font-mono text-white/70">
        <div><p class="text-white/40">PID</p><p class="text-white mt-1">${d.pid}</p></div>
        <div><p class="text-white/40">Port</p><p class="text-white mt-1">${d.port}</p></div>
        <div><p class="text-white/40">Proto</p><p class="text-white mt-1">${d.proto}</p></div>
      </div>
      <div class="text-xs font-mono text-white/50">${d.addr}</div>
      <button type="button" class="kill-btn w-full px-3 py-2 rounded-lg bg-red-600 hover:bg-red-500 text-white text-xs font-medium transition focus:outline-none focus:ring-2 focus:ring-red-500">Kill Process</button>
    `;
    card.querySelector(".kill-btn").addEventListener("click", () => killRow(d.pid));
    cardList.appendChild(card);
  });

  let activeProto = "ALL";

  function applyFilters() {
    const portVal = document.getElementById("portFilter").value.trim();
    let visibleCount = 0;

    document.querySelectorAll("#tableBody tr").forEach((row) => {
      const matchPort = !portVal || row.dataset.port.includes(portVal);
      const matchProto = activeProto === "ALL" || row.dataset.proto === activeProto;
      const show = matchPort && matchProto;
      row.classList.toggle("row-hidden", !show);
      if (show) visibleCount++;
    });

    document.querySelectorAll("#cardList > div").forEach((card) => {
      const matchPort = !portVal || card.dataset.port.includes(portVal);
      const matchProto = activeProto === "ALL" || card.dataset.proto === activeProto;
      card.classList.toggle("card-hidden", !(matchPort && matchProto));
    });

    document.getElementById("connCount").textContent = visibleCount;
    document.getElementById("emptyState").classList.toggle("hidden", visibleCount !== 0);
  }

  document.getElementById("portFilter").addEventListener("input", applyFilters);

  document.querySelectorAll(".proto-pill").forEach((btn) => {
    btn.addEventListener("click", () => {
      activeProto = btn.dataset.proto;
      document.querySelectorAll(".proto-pill").forEach((b) => {
        b.classList.remove("border-emerald-600", "bg-emerald-500/10", "text-emerald-400");
        b.classList.add("border-zinc-800", "bg-zinc-900", "text-white/70");
      });
      btn.classList.remove("border-zinc-800", "bg-zinc-900", "text-white/70");
      btn.classList.add("border-emerald-600", "bg-emerald-500/10", "text-emerald-400");
      applyFilters();
    });
  });
</script>
</body>
</html>
